[project]
name = "etlapi"
version = "1.0.0"
description = "Extractor e integrador de datos multi-origen"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
exclude = ["alembic/", "tests/"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
